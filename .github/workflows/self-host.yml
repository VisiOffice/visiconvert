name: Self-host verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer and package tests
        run: python3 -m unittest discover -s tests -v
      - name: Build licensed source package
        run: python3 scripts/package-self-host.py --release
      - name: Build production application and run Rust tests
        run: docker build --target app -t visiconvert-selfhost:ci .
      - name: Verify installation, persistence, backup, and restore
        run: python3 scripts/verify-self-host.py --image visiconvert-selfhost:ci
