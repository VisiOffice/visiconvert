[workspace]
members = ["crates/convert-domain", "crates/convert-adapters", "crates/convert-store", "crates/convert-server", "crates/convert-cli", "crates/convert-wasm"]
default-members = ["crates/convert-domain", "crates/convert-adapters", "crates/convert-store", "crates/convert-server", "crates/convert-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/VisiOffice/visiconvert"

[workspace.dependencies]
convert-domain = { path = "crates/convert-domain" }
convert-adapters = { path = "crates/convert-adapters" }
convert-store = { path = "crates/convert-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
serde_urlencoded = "0.7"
subtle = "2"
url = "2"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
aes-gcm = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

